[package]
name = "clarix"
version = "0.2.0"
description = "MG Enterprise — Digital Signage Management Desktop App (egui native)"
authors = ["MG Enterprise Team"]
edition = "2021"

[[bin]]
name = "clarix"
path = "src/main.rs"

[dependencies]
# Native UI (egui)
# egui is kept as a direct dependency so `egui::...` paths resolve in code
# (eframe only re-exports it, which does not put it in extern prelude).
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "accesskit",
    "clipboard",
    "links",
    "system_fonts",
] }
egui = "0.37"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
ffmpeg-sidecar = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid", "serde_json"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time & scheduling
chrono = { version = "0.4", features = ["serde"] }
# Filesystem
fs2 = "0.4"
# NOTE: calamine 0.26 was written against zip <2.6 (ZipFile gained an `R` generic in 2.6).
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
calamine = { version = "0.26", features = ["chrono"] }
csv = "1.3"

# LAN discovery
mdns-sd = "0.11"
local-ip-address = "0.6"
gethostname = "0.4"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio-stream = { version = "0.1", features = ["sync"] }
sha2 = "0.10"
futures-util = "0.3"

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Error handling
anyhow = "1"

# Environment files
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
